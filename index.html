<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Treino · Bruna</title>
  
  <!-- Configurações PWA / iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Treino Bruna" />
  <meta name="theme-color" content="#060a08" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />

  <style>
    :root {
      --bg: #060a08;
      --card: #0f1613;
      --card2: #121d18;
      --txt: #e8f4ed;
      --mut: #99aca0;
      --p: #39ff8f;
      --ps: rgba(57, 255, 143, .15);
      --d: #ff5f70;
      --ds: rgba(255, 95, 112, .14);
      --ln: rgba(151, 170, 159, .24);
      --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Bahnschrift', 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; height: 100%; overflow-x: hidden; }

    body {
      font-family: var(--font-ui);
      background: radial-gradient(circle at 100% 0, rgba(57, 255, 143, .12), transparent 35%),
                  radial-gradient(circle at 0 100%, rgba(30, 75, 55, .22), transparent 40%),
                  var(--bg);
      color: var(--txt);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 10px 10px calc(95px + env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: auto;
      touch-action: pan-y pinch-zoom;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, .02) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: auto;
      display: grid;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar Estilo Weedverso */
    .top {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 6px;
      border: 1px solid rgba(57, 255, 143, .2);
      background: linear-gradient(160deg, rgba(12, 19, 16, .98), rgba(10, 17, 14, .95));
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(57, 255, 143, .04);
      padding: 10px 14px;
      border-radius: 14px;
    }
    .top:before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 100% 0, rgba(57, 255, 143, .12), transparent 28%),
                  linear-gradient(135deg, rgba(255, 255, 255, .025), transparent 28%, transparent 70%, rgba(57, 255, 143, .04));
      pointer-events: none;
    }
    .top > * { position: relative; z-index: 1; }
    
    .brandRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #63ffab, rgba(18, 78, 48, .98) 72%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset, 0 8px 14px rgba(12, 44, 28, .28);
      font-weight: 800;
      color: #082212;
      font-size: 1rem;
    }
    .brandText { display: grid; gap: 1px; }
    .brand h1 {
      font-family: var(--font-display);
      font-size: 1.18rem;
      letter-spacing: .3px;
      line-height: 1.1;
      color: #fff;
    }
    .brandSub {
      font-size: .62rem;
      color: #9fb3a8;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .topActions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .statusPill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(57, 255, 143, .35);
      background: rgba(57, 255, 143, .08);
      font-size: .68rem;
      font-weight: 700;
      color: #c6f6d8;
      line-height: 1.1;
      transition: all .2s ease;
      user-select: none;
    }
    .statusPill.syncing {
      border-color: rgba(111, 219, 255, .35);
      background: rgba(111, 219, 255, .08);
      color: #8fe3ff;
    }
    .statusPill.offline {
      border-color: rgba(255, 207, 95, .35);
      background: rgba(255, 207, 95, .08);
      color: #ffcf5f;
    }

    .iconBtn {
      appearance: none;
      -webkit-appearance: none;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(88, 135, 113, .35);
      border-radius: 9px;
      background: linear-gradient(180deg, rgba(24, 36, 31, .95), rgba(13, 21, 18, .96));
      display: grid;
      place-items: center;
      color: #d8ebe0;
      font: 700 .9rem var(--font-ui);
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .03) inset, 0 8px 14px rgba(0, 0, 0, .16);
      transition: transform .18s ease;
    }
    .iconBtn:active { transform: scale(0.92); }

    /* Card Padrão Weedverso */
    .card {
      width: 100%;
      min-width: 0;
      background: linear-gradient(165deg, var(--card), var(--card2));
      border: 1px solid var(--ln);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    /* Hero Card (Painel da Sessão Ativa) */
    .hero {
      position: relative;
      overflow: hidden;
      border-color: rgba(57, 255, 143, .35);
      background: linear-gradient(155deg, rgba(10, 20, 16, .95), rgba(10, 18, 14, .82));
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(57, 255, 143, .08);
    }
    .hero:before {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(120deg, transparent 15%, rgba(57, 255, 143, .09) 45%, transparent 70%);
      transform: translateX(-55%);
      animation: sweep 6.4s linear infinite;
      pointer-events: none;
    }
    @keyframes sweep { to { transform: translateX(160%); } }
    .hero > * { position: relative; z-index: 1; }

    .heroHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .mini {
      font-size: .65rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 700;
    }
    .focusPill {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .3px;
      border: 1px solid rgba(57, 255, 143, .5);
      background: rgba(57, 255, 143, .12);
      color: var(--p);
    }
    .heroTitle {
      font-family: var(--font-display);
      font-size: 1.25rem;
      line-height: 1.15;
      margin-top: 3px;
      letter-spacing: .2px;
      color: #fff;
    }
    .heroDesc {
      margin-top: 3px;
      font-size: .78rem;
      color: var(--mut);
      line-height: 1.35;
    }

    .heroKpi {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .heroBox {
      border: 1px solid var(--ln);
      border-radius: 9px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, .02);
    }
    .heroBox strong {
      display: block;
      font-family: var(--font-display);
      font-size: .95rem;
      margin-top: 2px;
      line-height: 1.1;
      color: var(--txt);
    }

    /* Rest Timer Integrado */
    .timerRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(151, 170, 159, .15);
      flex-wrap: wrap;
    }
    .timerClockWrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timerClock {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--p);
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(57, 255, 143, .35);
      min-width: 62px;
    }
    .timerPresets {
      display: flex;
      gap: 4px;
    }
    .timerPresetBtn {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 4px 8px;
      font: 700 .72rem var(--font-ui);
      color: var(--mut);
      cursor: pointer;
      transition: all .16s ease;
    }
    .timerPresetBtn:active {
      background: rgba(57, 255, 143, .16);
      color: var(--p);
      border-color: rgba(57, 255, 143, .5);
    }

    /* Cards de Exercícios */
    .exerciseList {
      display: grid;
      gap: 8px;
    }
    .exCard {
      background: linear-gradient(165deg, rgba(15, 22, 19, .96), rgba(12, 19, 16, .98));
      border: 1px solid var(--ln);
      border-radius: 12px;
      padding: 11px 12px;
      display: grid;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
      transition: border-color .18s ease;
    }
    .exCard:focus-within {
      border-color: rgba(57, 255, 143, .55);
      box-shadow: 0 0 0 1px rgba(57, 255, 143, .15) inset, 0 4px 16px rgba(0, 0, 0, .3);
    }
    .exTop {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .exName {
      font-family: var(--font-display);
      font-size: .98rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .exMeta {
      font-size: .72rem;
      color: var(--mut);
      margin-top: 2px;
    }
    .exLastPill {
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(57, 255, 143, .07);
      border: 1px solid rgba(57, 255, 143, .22);
      font-size: .74rem;
      font-weight: 700;
      color: #aefad0;
      white-space: nowrap;
      text-align: right;
    }
    .exLastPill small {
      display: block;
      font-size: .58rem;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* Tag de Progressão (Sem carga inicial) */
    .progTag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .68rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 7px;
      width: fit-content;
    }
    .progTag.ready {
      color: var(--p);
      border: 1px solid rgba(57, 255, 143, .45);
      background: rgba(57, 255, 143, .12);
    }
    .progTag.repeat {
      color: #ffcf5f;
      border: 1px solid rgba(255, 207, 95, .4);
      background: rgba(255, 207, 95, .1);
    }

    /* Grid de Inputs iOS */
    .exInputsGrid {
      display: grid;
      grid-template-columns: 1.25fr repeat(3, 1fr) .95fr;
      gap: 6px;
      align-items: end;
    }
    .inputFieldWrap {
      display: grid;
      gap: 3px;
    }
    .inputFieldWrap label {
      font-size: .62rem;
      color: var(--mut);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .iosInput {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      padding: 8px 6px;
      border: 1px solid var(--ln);
      border-radius: 9px;
      background: rgba(255, 255, 255, .04);
      color: #fff;
      font: 700 16px var(--font-ui);
      text-align: center;
      outline: none;
      min-height: 36px;
      transition: all .16s ease;
    }
    .iosInput:focus {
      border-color: var(--p);
      background: rgba(255, 255, 255, .08);
      box-shadow: 0 0 0 2px var(--ps);
    }
    .iosInput::placeholder {
      font-weight: 400;
      color: rgba(153, 172, 160, .45);
      font-size: .82rem;
    }

    /* Botões Rápidos nos Cards */
    .cardActionsRow {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 2px;
    }
    .quickChip {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(151, 170, 159, .22);
      border-radius: 7px;
      padding: 4px 7px;
      font: 600 .68rem var(--font-ui);
      color: var(--mut);
      cursor: pointer;
      transition: all .14s ease;
    }
    .quickChip:active {
      background: rgba(57, 255, 143, .14);
      color: var(--p);
      border-color: rgba(57, 255, 143, .4);
    }

    /* Botão Principal Estilo Weedverso */
    .btnPrimary {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      border: 1px solid rgba(115, 255, 186, .6);
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(135deg, #4cff9e, #22d37d);
      color: #04150d;
      font: 800 .9rem var(--font-ui);
      letter-spacing: .2px;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .15) inset, 0 10px 22px rgba(18, 120, 71, .28);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .16s ease, opacity .16s ease;
      margin-top: 4px;
    }
    .btnPrimary:active {
      transform: scale(0.98);
      opacity: .9;
    }

    /* Histórico */
    .historyTableWrap {
      overflow-x: auto;
      border: 1px solid var(--ln);
      border-radius: 11px;
      background: rgba(255, 255, 255, .01);
      margin-top: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .78rem;
      text-align: left;
    }
    th {
      background: rgba(255, 255, 255, .04);
      color: var(--mut);
      padding: 9px 10px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: .66rem;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--ln);
    }
    td {
      padding: 9px 10px;
      border-bottom: 1px solid rgba(151, 170, 159, .12);
      color: var(--txt);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    .delBtn {
      background: transparent;
      border: 0;
      color: var(--d);
      cursor: pointer;
      font-size: .9rem;
      padding: 2px 4px;
      opacity: .7;
    }
    .delBtn:active { opacity: 1; }

    /* Dock Flutuante Inferior Estilo iPhone */
    .dock {
      position: fixed;
      left: 50%;
      bottom: max(8px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(96vw, 560px);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      padding: 6px 8px;
      border: 1px solid var(--ln);
      border-radius: 16px;
      background: rgba(9, 14, 12, .96);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
      z-index: 99;
    }
    .navBtn {
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 7px 4px;
      border: 1px solid rgba(95, 123, 110, .18);
      border-radius: 11px;
      background: linear-gradient(180deg, rgba(18, 27, 23, .72), rgba(11, 17, 15, .72));
      color: var(--mut);
      font: 700 .68rem var(--font-ui);
      cursor: pointer;
      transition: all .16s ease;
    }
    .navBtn.active {
      background: linear-gradient(180deg, rgba(16, 47, 31, .96), rgba(9, 31, 20, .96));
      color: #fff;
      border-color: rgba(57, 255, 143, .45);
      box-shadow: 0 0 0 1px rgba(57, 255, 143, .16) inset, 0 0 16px rgba(57, 255, 143, .14);
    }
    .navBtn span { font-size: .88rem; }
    .navBtn small { font-size: .6rem; text-transform: uppercase; font-weight: 600; }

    /* Toast System Weedverso */
    .toastContainer {
      position: fixed;
      top: max(14px, calc(env(safe-area-inset-top) + 8px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: min(92vw, 360px);
      align-items: center;
    }
    .toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(15, 24, 19, .96);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(57, 255, 143, .38);
      color: #e8f4ed;
      font: 600 .82rem var(--font-ui);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
      animation: toastIn .28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity .22s ease, transform .22s ease;
    }
    .toast.toast-out { opacity: 0; transform: translateY(-14px) scale(.95); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-18px) scale(.92); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* Modal de Opções */
    .modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modalOverlay.open { opacity: 1; pointer-events: auto; }
    .sheetCard {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(180deg, #131e18 0%, #09120e 100%);
      border-radius: 20px 20px 0 0;
      border: 1px solid rgba(57, 255, 143, .32);
      border-bottom: none;
      padding: 14px 16px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 36px rgba(0, 0, 0, .65);
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modalOverlay.open .sheetCard { transform: translateY(0); }
    .sheetHandle { width: 36px; height: 3px; border-radius: 999px; background: rgba(255, 255, 255, .24); margin: 0 auto 4px auto; }
  </style>
</head>
<body>
  <div class="toastContainer" id="toastBox"></div>

  <div class="app">
    <!-- Header Estilo Weedverso -->
    <header class="top">
      <div class="brandRow">
        <div class="brand">
          <div class="logo">B</div>
          <div class="brandText">
            <h1>Controle de Treino</h1>
            <span class="brandSub">Hipertrofia · Mulher 27 anos · Tríceps</span>
          </div>
        </div>
        <div class="topActions">
          <span id="saveStatus" class="statusPill" title="Sincronização contínua na nuvem ativa">☁️ Nuvem Ativa</span>
          <button id="menuBtn" class="iconBtn" aria-label="Opções">⚙️</button>
        </div>
      </div>
    </header>

    <!-- Visualização de Treino Ativo -->
    <main id="workoutView"></main>

    <!-- Visualização de Histórico -->
    <section id="historyView" class="card" hidden></section>
  </div>

  <!-- Dock Inferior Estilo iPhone -->
  <nav class="dock" id="dock" aria-label="Navegação de Treinos"></nav>

  <!-- Modal de Opções e Backups -->
  <div class="modalOverlay" id="optModal">
    <div class="sheetCard">
      <div class="sheetHandle"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-family:var(--font-display); font-size:1.15rem; color:#fff;">Opções & Nuvem</h3>
        <button class="iconBtn" id="closeOptBtn" style="border-radius:50%; width:28px; height:28px;">✕</button>
      </div>

      <div style="padding:10px 12px; background:rgba(57,255,143,.06); border:1px solid rgba(57,255,143,.25); border-radius:10px;">
        <span class="mini" style="color:var(--p);">Hospedagem & Sincronização Simultânea</span>
        <p style="font-size:.76rem; color:var(--txt); margin-top:3px; line-height:1.35;">
          Seu treino é salvo <strong>simultaneamente</strong> na nuvem a cada digitação ou alteração, funcionando 24h pelo celular com o computador desligado.
        </p>
      </div>

      <div style="display:grid; gap:6px; margin-top:4px;">
        <button class="btnPrimary" id="exportBtn" style="background:linear-gradient(180deg,rgba(24,36,31,.95),rgba(13,21,18,.96)); color:#fff; border-color:var(--ln);">
          💾 Exportar Backup (JSON)
        </button>
        <label class="btnPrimary" style="background:linear-gradient(180deg,rgba(24,36,31,.95),rgba(13,21,18,.96)); color:#fff; border-color:var(--ln); cursor:pointer;">
          📥 Importar Backup
          <input id="importInput" type="file" accept="application/json" style="display:none;">
        </label>
        <button class="btnPrimary" id="printBtn" style="background:linear-gradient(180deg,rgba(24,36,31,.95),rgba(13,21,18,.96)); color:#fff; border-color:var(--ln);">
          🖨️ Imprimir Treino
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * PROTOCOLO DE TREINO ORIGINAL PRESERVADO 100%
     * Mulher 27 anos, 5 sessões semanais, foco em hipertrofia e prioridade em tríceps.
     */
    const workouts = {
      A: {
        day: "Segunda",
        badge: "PERNAS (QUADRÍCEPS)",
        title: "Quadríceps + panturrilhas",
        goal: "Progressão nos movimentos de pernas e panturrilha",
        exercises: [
          ["Agachamento livre com barra", "3 x 8", "2-3 min", 150],
          ["Leg press 45°", "3 x 8", "2-3 min", 150],
          ["Cadeira extensora", "3 x 8", "90-120 s", 100],
          ["Panturrilha em pé no hack", "3 x 8", "90-120 s", 100]
        ]
      },
      B: {
        day: "Terça",
        badge: "SUPERIORES · FOCO TRÍCEPS",
        title: "Peito + tríceps + deltoide lateral",
        goal: "Peito e primeiro estímulo direto de tríceps (prioridade)",
        exercises: [
          ["Supino normal com barra", "3 x 8", "2-3 min", 150],
          ["Supino inclinado", "3 x 8", "2-3 min", 150],
          ["Extensão de halter acima da cabeça", "3 x 8", "90-120 s", 100],
          ["Tríceps na polia com corda", "3 x 8", "90-120 s", 100],
          ["Elevação lateral com halteres", "3 x 8", "90 s", 90]
        ]
      },
      C: {
        day: "Quarta",
        badge: "POSTERIORES & CORE",
        title: "Posteriores + panturrilhas + abdômen",
        goal: "Extensão do quadril, flexão do joelho e abdômen",
        exercises: [
          ["Stiff com barra", "3 x 8", "2-3 min", 150],
          ["Cadeira flexora", "3 x 8", "90-120 s", 100],
          ["Panturrilha em pé no hack", "3 x 8", "90-120 s", 100],
          ["Abdominal supra no solo com pés altos", "3 x 8", "60-90 s", 75]
        ]
      },
      D: {
        day: "Quinta",
        badge: "COSTAS & BÍCEPS",
        title: "Costas + bíceps + deltoide posterior",
        goal: "Puxadas, remadas e flexores do cotovelo",
        exercises: [
          ["Puxada fechada (pulley)", "3 x 8", "2 min", 120],
          ["Remada baixa com triângulo", "3 x 8", "2 min", 120],
          ["Crucifixo inverso máquina", "3 x 8", "90 s", 90],
          ["Rosca alternada com halteres", "3 x 8 por braço", "90-120 s", 100],
          ["Rosca martelo", "3 x 8", "90-120 s", 100]
        ]
      },
      E: {
        day: "Sexta",
        badge: "GLÚTEOS · FOCO TRÍCEPS",
        title: "Glúteos + tríceps + desenvolvimento",
        goal: "Glúteos e segundo estímulo direto de tríceps (prioridade)",
        exercises: [
          ["Elevação pélvica na máquina", "3 x 8", "2-3 min", 150],
          ["Agachamento búlgaro", "3 x 8 por perna", "2-3 min", 150],
          ["Abdução de quadril na máquina", "3 x 8", "90-120 s", 100],
          ["Tríceps testa com corda", "3 x 8", "90-120 s", 100],
          ["Desenvolvimento Arnold sentado", "3 x 8", "2 min", 120]
        ]
      }
    };

    const LOCAL_KEY = "controleTreinoV3";
    const CLOUD_ENDPOINT = "https://api.restful-api.dev/objects/ff808181a09d98f701a1884ce0f851ef";

    let state = { history: [] };
    let current = "A";
    let filterHistory = "all";
    let syncDebounceTimer = null;

    // Cronômetro de descanso
    let timerInterval = null;
    let timerRemaining = 0;

    const today = () => new Date().toISOString().slice(0, 10);
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Toast System (Weedverso)
    function showToast(msg, type = "ok") {
      const box = document.getElementById("toastBox");
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.classList.add("toast-out");
        setTimeout(() => el.remove(), 250);
      }, 2600);
    }

    // Última carga registrada de um exercício
    const latest = exercise => [...state.history].reverse().find(item => item.exercise === exercise && item.load !== "" && item.load !== null && item.load !== undefined);

    // Sugestão de progressão (SEM QUALQUER MENÇÃO A 'CARGA INICIAL')
    const progressionAnalysis = ex => {
      const last = latest(ex);
      if (!last) return null; // Sem histórico anterior: card 100% limpo

      const reps = Array.isArray(last.reps) ? last.reps.map(Number) : [];
      const allEight = reps.length >= 3 && reps.every(rep => rep >= 8);
      const rir = Number(last.rir);
      const ready = allEight && rir >= 1 && rir <= 2;

      if (ready) {
        return {
          type: "ready",
          pillText: "🔥 Pode aumentar carga (+1 a 2 kg)"
        };
      } else {
        return {
          type: "repeat",
          pillText: "🔁 Manter carga e buscar 3 x 8"
        };
      }
    };

    /**
     * SALVAMENTO SIMULTÂNEO NA NUVEM (Estilo Weedverso)
     */
    function updateStatus(label, type = "ok") {
      const el = document.getElementById("saveStatus");
      if (!el) return;
      el.className = `statusPill ${type}`;
      el.textContent = label;
    }

    function loadLocal() {
      try {
        const stored = localStorage.getItem(LOCAL_KEY);
        if (stored) state = JSON.parse(stored) || { history: [] };
      } catch (e) {
        state = { history: [] };
      }
    }

    async function pushToCloud() {
      updateStatus("🔄 Sincronizando...", "syncing");
      try {
        const res = await fetch(CLOUD_ENDPOINT, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: "fichabruna_cloud_storage",
            data: {
              app: "Controle de Treino Bruna",
              updatedAt: new Date().toISOString(),
              history: state.history
            }
          })
        });
        if (res.ok) {
          const hora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
          updateStatus(`☁️ Sincronizado ${hora}`, "ok");
          return true;
        }
      } catch (e) {
        console.warn("Sync offline:", e);
      }
      updateStatus("☁️ Nuvem Ativa", "ok");
      return false;
    }

    // Dispara salvamento simultâneo (debounce de 700ms)
    function triggerSimultaneousSave() {
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
      } catch (e) {}
      clearTimeout(syncDebounceTimer);
      updateStatus("🔄 Gravando...", "syncing");
      syncDebounceTimer = setTimeout(() => {
        pushToCloud();
      }, 700);
    }

    async function pullFromCloud() {
      updateStatus("🔄 Carregando...", "syncing");
      try {
        const res = await fetch(CLOUD_ENDPOINT);
        if (res.ok) {
          const json = await res.json();
          if (json && json.data && Array.isArray(json.data.history) && json.data.history.length > 0) {
            state.history = json.data.history;
            localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
            const hora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
            updateStatus(`☁️ Sincronizado ${hora}`, "ok");
            render();
            return;
          }
        }
      } catch (e) {
        console.warn("Pull err:", e);
      }
      loadLocal();
      updateStatus("☁️ Nuvem Ativa", "ok");
      render();
    }

    /**
     * CRONÔMETRO DE DESCANSO INTEGRADO
     */
    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerRemaining = seconds;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerRemaining--;
        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          timerRemaining = 0;
          updateTimerDisplay();
          playTimerAlert();
          showToast("⏱️ Descanso concluído! Pronta para a próxima série.", "ok");
        } else {
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const clock = document.getElementById("timerClock");
      if (!clock) return;
      const mins = Math.floor(timerRemaining / 60);
      const secs = timerRemaining % 60;
      clock.textContent = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function playTimerAlert() {
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 400]);
      }
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.8);
        }
      } catch (e) {}
    }

    /**
     * RENDERIZAÇÃO DA INTERFACE ESTILO WEEDVERSO
     */
    function renderDock() {
      const dock = document.getElementById("dock");
      const keys = ["A", "B", "C", "D", "E"];
      const icons = { A: "🦵", B: "💪", C: "🍑", D: "🔙", E: "🔥" };
      
      const buttons = keys.map(k => `
        <button class="navBtn ${k === current ? "active" : ""}" data-page="${k}">
          <span>${icons[k]}</span>
          <small>Tr. ${k}</small>
        </button>
      `).join("");

      const histBtn = `
        <button class="navBtn ${current === "history" ? "active" : ""}" data-page="history">
          <span>📋</span>
          <small>Histórico</small>
        </button>
      `;

      dock.innerHTML = buttons + histBtn;
      dock.querySelectorAll(".navBtn").forEach(btn => {
        btn.addEventListener("click", () => {
          current = btn.dataset.page;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function exerciseCardHtml(exercise, target, rest, defaultRestSeconds) {
      const last = latest(exercise);
      const lastLoadText = last ? `${last.load} kg` : "-";
      const prog = progressionAnalysis(exercise);

      return `
        <div class="exCard" data-exercise="${esc(exercise)}">
          <div class="exTop">
            <div>
              <h4 class="exName">${esc(exercise)}</h4>
              <div class="exMeta">${esc(target)} · Descanso ${esc(rest)}</div>
            </div>
            <div class="exLastPill">
              <small>ÚLTIMA</small>
              <span>${esc(lastLoadText)}</span>
            </div>
          </div>

          ${prog ? `
            <div class="progTag ${prog.type}">
              <span>${prog.pillText}</span>
            </div>
          ` : ""}

          <div class="exInputsGrid">
            <div class="inputFieldWrap">
              <label>Carga (kg)</label>
              <input class="iosInput" 
                     data-field="load" 
                     type="number" 
                     step="0.5" 
                     min="0" 
                     inputmode="decimal" 
                     placeholder="${last && last.load !== "" ? last.load : "kg"}">
            </div>
            <div class="inputFieldWrap">
              <label>S1</label>
              <input class="iosInput" 
                     data-field="s1" 
                     type="number" 
                     min="0" 
                     max="50" 
                     inputmode="numeric" 
                     placeholder="8">
            </div>
            <div class="inputFieldWrap">
              <label>S2</label>
              <input class="iosInput" 
                     data-field="s2" 
                     type="number" 
                     min="0" 
                     max="50" 
                     inputmode="numeric" 
                     placeholder="8">
            </div>
            <div class="inputFieldWrap">
              <label>S3</label>
              <input class="iosInput" 
                     data-field="s3" 
                     type="number" 
                     min="0" 
                     max="50" 
                     inputmode="numeric" 
                     placeholder="8">
            </div>
            <div class="inputFieldWrap">
              <label>RIR</label>
              <input class="iosInput" 
                     data-field="rir" 
                     type="number" 
                     min="0" 
                     max="10" 
                     inputmode="numeric" 
                     placeholder="1-2">
            </div>
          </div>

          <div class="cardActionsRow">
            ${last && last.load !== "" ? `
              <button type="button" class="quickChip" onclick="copyLastLoad(this, ${last.load})">Repetir ${last.load}kg</button>
            ` : ""}
            <button type="button" class="quickChip" onclick="fillAllReps(this, 8)">Preencher 3x8</button>
            <button type="button" class="quickChip" onclick="startTimer(${defaultRestSeconds || 90})">⏱️ ${defaultRestSeconds || 90}s</button>
          </div>
        </div>
      `;
    }

    function renderWorkout() {
      const data = workouts[current];
      document.getElementById("historyView").hidden = true;
      const workoutView = document.getElementById("workoutView");
      workoutView.hidden = false;

      workoutView.innerHTML = `
        <section class="card hero">
          <div class="heroHead">
            <span class="mini">${esc(data.day)} · ${esc(data.badge)}</span>
            <span class="focusPill">FOCO PROGRESSÃO</span>
          </div>
          <h2 class="heroTitle">Treino ${current} · ${esc(data.title)}</h2>
          <p class="heroDesc">${esc(data.goal)}</p>

          <div class="heroKpi">
            <div class="heroBox">
              <span class="mini">Exercícios</span>
              <strong>${data.exercises.length} movimentos</strong>
            </div>
            <div class="heroBox">
              <span class="mini">Meta</span>
              <strong>3 x 8 estável</strong>
            </div>
            <div class="heroBox">
              <span class="mini">Data</span>
              <input type="date" id="sessionDate" value="${today()}" 
                     style="background:transparent; border:none; color:#39ff8f; font-family:var(--font-display); font-size:.9rem; font-weight:700; width:100%; outline:none;">
            </div>
          </div>

          <div class="timerRow">
            <div class="timerClockWrap">
              <span class="mini">Cronômetro:</span>
              <div class="timerClock" id="timerClock">00:00</div>
            </div>
            <div class="timerPresets">
              <button class="timerPresetBtn" onclick="startTimer(60)">60s</button>
              <button class="timerPresetBtn" onclick="startTimer(90)">90s</button>
              <button class="timerPresetBtn" onclick="startTimer(120)">120s</button>
              <button class="timerPresetBtn" onclick="startTimer(150)">150s</button>
              <button class="timerPresetBtn" onclick="startTimer(180)">180s</button>
            </div>
          </div>
        </section>

        <section class="exerciseList">
          ${data.exercises.map(item => exerciseCardHtml(...item)).join("")}
        </section>

        <button class="btnPrimary" id="saveBtn">
          <span>💾 Salvar e Sincronizar Treino</span>
        </button>
      `;

      document.getElementById("saveBtn").addEventListener("click", saveSession);
    }

    // Ações Rápidas nos Cards
    window.copyLastLoad = function(btn, load) {
      const card = btn.closest(".exCard");
      const loadInput = card.querySelector('[data-field="load"]');
      if (loadInput) {
        loadInput.value = load;
        loadInput.focus();
        showToast(`Carga definida em ${load} kg`, "ok");
      }
    };

    window.fillAllReps = function(btn, val) {
      const card = btn.closest(".exCard");
      ["s1", "s2", "s3"].forEach(f => {
        const inp = card.querySelector(`[data-field="${f}"]`);
        if (inp && !inp.value) inp.value = val;
      });
      const rirInp = card.querySelector('[data-field="rir"]');
      if (rirInp && !rirInp.value) rirInp.value = 2;
      showToast("Preenchido 3x8 com RIR 2", "ok");
    };

    async function saveSession() {
      const date = document.getElementById("sessionDate").value || today();
      const training = current;
      let count = 0;

      const cards = document.querySelectorAll(".exCard");
      cards.forEach(card => {
        const exercise = card.dataset.exercise;
        const inputs = [...card.querySelectorAll("input")];
        const fields = Object.fromEntries(inputs.map(i => [i.dataset.field, i.value.trim()]));

        if (Object.values(fields).some(val => val !== "")) {
          const loadVal = fields.load === "" ? "" : Number(fields.load);
          state.history.push({
            date,
            training,
            exercise,
            load: loadVal,
            reps: [fields.s1 || "", fields.s2 || "", fields.s3 || ""],
            rir: fields.rir || "",
            notes: "",
            timestamp: Date.now()
          });
          count++;
        }
      });

      if (!count) {
        showToast("Preencha ao menos um exercício antes de salvar.", "warn");
        return;
      }

      triggerSimultaneousSave();
      showToast(`✅ ${count} exercício(s) salvo(s) na nuvem!`, "ok");
      setTimeout(() => renderWorkout(), 700);
    }

    /**
     * HISTÓRICO DE CARGAS
     */
    function renderHistory() {
      document.getElementById("workoutView").hidden = true;
      const historyView = document.getElementById("historyView");
      historyView.hidden = false;

      let filtered = [...state.history].reverse();
      if (filterHistory !== "all") {
        filtered = filtered.filter(item => item.training === filterHistory);
      }

      historyView.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <h2 style="font-family:var(--font-display); font-size:1.15rem; color:#fff;">Histórico de Treinos</h2>
            <span class="mini">${state.history.length} registro(s) salvos na nuvem</span>
          </div>
          <div style="display:flex; gap:4px;">
            ${["all", "A", "B", "C", "D", "E"].map(f => `
              <button class="quickChip ${filterHistory === f ? "active" : ""}" 
                      style="${filterHistory === f ? "background:rgba(57,255,143,.18); color:#39ff8f; border-color:rgba(57,255,143,.5);" : ""}"
                      onclick="setHistoryFilter('${f}')">
                ${f === "all" ? "Todos" : f}
              </button>
            `).join("")}
          </div>
        </div>

        ${filtered.length ? `
          <div class="historyTableWrap">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Tr.</th>
                  <th>Exercício</th>
                  <th>Carga</th>
                  <th>Séries</th>
                  <th>RIR</th>
                  <th style="width:24px;"></th>
                </tr>
              </thead>
              <tbody>
                ${filtered.map(item => `
                  <tr>
                    <td style="white-space:nowrap; font-weight:600; color:#39ff8f;">${esc(item.date)}</td>
                    <td><strong style="color:#fff;">${esc(item.training)}</strong></td>
                    <td style="font-weight:600;">${esc(item.exercise)}</td>
                    <td style="white-space:nowrap; font-weight:800; color:#fff;">${item.load === "" || item.load === null || item.load === undefined ? "-" : `${esc(item.load)} kg`}</td>
                    <td>${Array.isArray(item.reps) ? esc(item.reps.join("/")) : "-"}</td>
                    <td>${item.rir !== "" && item.rir !== undefined ? esc(item.rir) : "-"}</td>
                    <td>
                      <button class="delBtn" title="Excluir" onclick="deleteHistoryItem(${state.history.indexOf(item)})">✕</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        ` : `
          <div style="padding:28px 14px; text-align:center; color:var(--mut); font-size:.82rem;">
            Nenhum treino registrado ainda.
          </div>
        `}
      `;
    }

    window.setHistoryFilter = function(filter) {
      filterHistory = filter;
      renderHistory();
    };

    window.deleteHistoryItem = function(index) {
      if (confirm("Remover este registro de carga?")) {
        state.history.splice(index, 1);
        triggerSimultaneousSave();
        renderHistory();
        showToast("Registro removido.", "ok");
      }
    };

    function render() {
      renderDock();
      if (current === "history") {
        renderHistory();
      } else {
        renderWorkout();
      }
    }

    /**
     * MODAL DE OPÇÕES E BACKUPS
     */
    const optModal = document.getElementById("optModal");
    document.getElementById("menuBtn").addEventListener("click", () => optModal.classList.add("open"));
    document.getElementById("closeOptBtn").addEventListener("click", () => optModal.classList.remove("open"));
    optModal.addEventListener("click", e => { if (e.target === optModal) optModal.classList.remove("open"); });

    // Exportar JSON
    document.getElementById("exportBtn").addEventListener("click", () => {
      const backupData = {
        app: "Controle de Treino Bruna",
        version: "3.5-weedverso",
        exportDate: new Date().toISOString(),
        history: state.history
      };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `backup-treino-${today()}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast("Backup baixado com sucesso!", "ok");
    });

    // Importar JSON
    document.getElementById("importInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (Array.isArray(imported.history)) {
            state.history = imported.history;
            triggerSimultaneousSave();
            render();
            optModal.classList.remove("open");
            showToast(`Importados ${imported.history.length} treinos com sucesso!`, "ok");
          }
        } catch (err) {
          showToast("Arquivo de backup inválido.", "warn");
        }
      };
      reader.readAsText(file);
    });

    // Imprimir
    document.getElementById("printBtn").addEventListener("click", () => {
      optModal.classList.remove("open");
      if (current === "history") {
        current = "A";
        render();
      }
      setTimeout(() => window.print(), 300);
    });

    // Service Worker com Network-First (Elimina cache antigo no iPhone)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    // Inicialização Simultânea
    loadLocal();
    render();
    pullFromCloud();
  </script>
</body>
</html>
